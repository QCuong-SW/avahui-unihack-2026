name: Render Backend Keep-Alive Heartbeat

on:
  schedule:
    # Run every 5 minutes (shortest GitHub Actions cron interval) to prevent Render 15-min spin-down
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual heartbeat ping'
        required: false
        default: 'Manual test ping'

concurrency:
  group: backend-keepalive
  cancel-in-progress: false

jobs:
  keep-alive:
    name: Ping Backend Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend Health Endpoint (Burst 1 & 2)
        run: |
          echo "=========================================="
          echo "Triggering Keep-Alive Heartbeat for AvaHui"
          echo "Target: https://avahui-api.onrender.com/api/v1/health"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "=========================================="

          # Retry up to 4 times with 5s delay and 70s max request timeout for cold starts
          RESPONSE=$(curl -sS --fail-with-body \
            --retry 4 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 70 \
            https://avahui-api.onrender.com/api/v1/health)

          echo "Response from API (Pulse 1):"
          echo "$RESPONSE"

          sleep 20

          RESPONSE2=$(curl -sS --fail-with-body \
            --max-time 30 \
            https://avahui-api.onrender.com/api/v1/health)
          echo "Response from API (Pulse 2):"
          echo "$RESPONSE2"
          echo "Backend & Neon DB are active and awake!"

      - name: Ping Vercel Frontend Edge Cache
        run: |
          echo "Pinging Vercel Web App: https://avahui-unihack-2026-web.vercel.app"
          curl -sS -I --max-time 15 https://avahui-unihack-2026-web.vercel.app | head -n 5
